<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AI Agent R&D — Harness · LLM · Glue · IETF — Interactive Mindmap</title>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --ink: #e8eaed; --muted: #9aa3af;
    --line: #2a2f3a; --accent: #6ea8fe; --why: #d8c79c; --whyline: #b08d3a;
    --recent: #9dd1b0; --recentline: #2f7d52;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  #app { display: grid; grid-template-columns: 1fr 400px; height: 100vh; }
  #stage { position: relative; overflow: hidden; }
  svg { width: 100%; height: 100%; display: block; cursor: grab; }
  svg:active { cursor: grabbing; }
  .link { fill: none; stroke: var(--line); stroke-width: 1.5px; }
  .node circle { stroke-width: 2px; cursor: pointer; }
  .node text { fill: var(--ink); cursor: pointer; paint-order: stroke;
    stroke: var(--bg); stroke-width: 3px; font-size: 13px; }
  .node.dim { opacity: 0.18; }
  .node.match text { fill: #ffe082; font-weight: 700; }
  .node.selected circle { stroke: #ffe082 !important; }
  .node.selected text { fill: #ffe082; font-weight: 700; }
  .node.hasinfo text { text-decoration: underline dotted #ffd54f; text-underline-offset: 3px; }

  #panel { background: var(--panel); border-left: 1px solid var(--line); padding: 22px 20px; overflow-y: auto; }
  #panel h1 { font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0 0 4px; font-weight: 600; }
  #crumb { color: var(--muted); font-size: 12px; margin-bottom: 14px; min-height: 16px; }
  #term { font-size: 22px; font-weight: 700; margin: 0 0 10px; line-height: 1.25; }
  #def { font-size: 15px; color: var(--ink); }
  #def.empty { color: var(--muted); font-style: italic; }
  #why, #refs, #impl, #recent { margin-top: 16px; }
  #why[hidden], #refs[hidden], #impl[hidden], #recent[hidden] { display: none; }
  #why h2, #refs h2, #impl h2, #recent h2 { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0 0 6px; }
  #why p { margin: 0; font-size: 14px; color: #e7dcc2; background: #221f17; border-left: 3px solid var(--whyline); padding: 9px 11px; border-radius: 4px; }
  .ref { margin-bottom: 9px; font-size: 12.5px; line-height: 1.35; }
  .ref a { color: #9ec1ff; text-decoration: none; }
  .ref a:hover { text-decoration: underline; }
  .ref .venue { display: block; color: var(--muted); font-size: 11px; }
  .ref .find { display: block; color: var(--recent); font-size: 12px; margin-top: 2px; }
  #recent .ref { border-left: 3px solid var(--recentline); padding-left: 9px; background: #16201a; border-radius: 4px; padding: 7px 9px; }
  #kids { margin-top: 18px; }
  #kids h2 { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0 0 8px; }
  #kids button { display: block; width: 100%; text-align: left; background: transparent; color: var(--ink);
    border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; margin-bottom: 6px; cursor: pointer; font-size: 13px; }
  #kids button:hover { border-color: var(--accent); }
  #kids button.present-btn { background: var(--accent); color: #0b0e13; border-color: var(--accent); font-weight: 700; margin-bottom: 12px; }
  #kids button.present-btn:hover { filter: brightness(1.08); }
  .swatch { display: inline-block; width: 14px; height: 14px; border-radius: 3px; margin-right: 10px; vertical-align: middle; }

  #bar { position: absolute; top: 12px; left: 12px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; z-index: 5; }
  #bar input[type="search"], #bar button { background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; font-size: 13px; }
  #bar input[type="search"] { width: 170px; }
  #bar button { cursor: pointer; }
  #bar button:hover { border-color: var(--accent); }
  .tog { display: flex; align-items: center; gap: 5px; color: var(--ink); font-size: 13px; user-select: none; cursor: pointer;
    background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; }
  .tog input { cursor: pointer; margin: 0; }
  #hint { position: absolute; bottom: 10px; left: 12px; color: var(--muted); font-size: 12px; z-index: 5; }
  @media (max-width: 820px) { #app { grid-template-columns: 1fr; grid-template-rows: 1fr 42vh; } #panel { border-left: none; border-top: 1px solid var(--line); } }

  #slide { position: fixed; inset: 0; background: rgba(10,12,16,0.98); z-index: 50; overflow: auto; padding: 56px 48px 48px; }
  #slide[hidden] { display: none; }
  #slideInner { max-width: 1140px; margin: 0 auto; }
  #slideCrumb { color: var(--muted); font-size: 13px; letter-spacing: .04em; margin-bottom: 10px; }
  #slideTitle { font-size: 34px; margin: 0 0 12px; }
  #slideDef { font-size: 17px; color: #cdd3db; max-width: 820px; margin: 0 0 14px; }
  #slideWhy { max-width: 820px; color: var(--why); border-left: 3px solid var(--whyline); padding: 9px 13px; margin: 0 0 16px; font-size: 15px; background: #221f17; border-radius: 4px; }
  #slideSources { color: var(--muted); font-size: 13px; margin: 0 0 16px; }
  #slideSources a { color: #9ec1ff; text-decoration: none; }
  #slideSources a:hover { text-decoration: underline; }
  #slideWhy:empty, #slideSources:empty, #slideRecent:empty { display: none; }
  #slideRecent { max-width: 900px; margin: 0 0 22px; }
  #slideRecent h4 { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0 0 8px; }
  #slideRecent .ref { border-left: 3px solid var(--recentline); padding: 6px 10px; background: #16201a; border-radius: 4px; }
  #slideGrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 16px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-top: 3px solid var(--accent); border-radius: 12px; padding: 16px 18px; }
  .card.hasKids { cursor: pointer; }
  .card.hasKids:hover { border-color: var(--accent); }
  .card h3 { margin: 0 0 6px; font-size: 17px; }
  .card p { margin: 0; color: #cbd2da; font-size: 14px; }
  .card .why { margin: 10px 0 0; font-size: 13px; color: var(--why); border-left: 2px solid var(--whyline); padding-left: 9px; }
  .card .sources { margin-top: 10px; font-size: 12px; color: var(--muted); }
  .card .sources a { color: #9ec1ff; text-decoration: none; }
  .card .sources a:hover { text-decoration: underline; }
  .card ul.sub { margin: 12px 0 0; padding-left: 18px; color: #aeb6c0; font-size: 13px; }
  .card ul.sub li { margin-bottom: 5px; }
  .card ul.sub b { color: var(--ink); }
  #slideNav { position: fixed; top: 16px; right: 24px; display: flex; gap: 8px; align-items: center; z-index: 51; }
  #slideNav button { background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; cursor: pointer; font-size: 13px; }
  #slideNav button:hover { border-color: var(--accent); }
  #slidePos { color: var(--muted); font-size: 13px; min-width: 54px; text-align: center; }

  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { display: inline-block; background: #1b2330; border: 1px solid var(--line); border-radius: 999px; padding: 3px 9px; font-size: 12px; color: #cdd6e2; white-space: nowrap; text-decoration: none; }
  a.chip:hover { border-color: var(--accent); color: #fff; }
  .card .impl { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 5px; }
  #slideImpl { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 22px; }
  #slideImpl:empty { display: none; }
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <div id="bar">
      <input id="search" type="search" placeholder="Search…" />
      <button id="expand">Expand all</button>
      <button id="collapse">Collapse</button>
      <button id="reset">Reset</button>
      <label class="tog"><input type="checkbox" id="togWhy" /> Why</label>
      <label class="tog"><input type="checkbox" id="togRefs" /> Top papers</label>
      <label class="tog"><input type="checkbox" id="togRecent" /> Recent findings</label>
      <label class="tog"><input type="checkbox" id="togImpl" /> Landscape</label>
    </div>
    <svg></svg>
    <div id="hint">↑↓ move · → expand · ← collapse · Enter present · click to pin · toggles: Why / Top papers / Recent findings / Landscape</div>
  </div>
  <div id="panel">
    <h1>AI Agent R&amp;D</h1>
    <div id="crumb"></div>
    <div id="term">AI Agent = Harness + LLM</div>
    <div id="def" class="empty">Click or use arrow keys on any node. Toggle <b>Top papers</b> (3 seminal) and <b>Recent findings</b> (recent papers + latest result) above.</div>
    <div id="why" hidden></div>
    <div id="refs" hidden></div>
    <div id="recent" hidden></div>
    <div id="impl" hidden></div>
    <div id="kids"></div>
  </div>
</div>

<div id="slide" hidden>
  <div id="slideNav">
    <button id="prevSib">‹ Prev</button>
    <span id="slidePos"></span>
    <button id="nextSib">Next ›</button>
    <button id="upSlide">↑ Up</button>
    <button id="closeSlide">Close ✕</button>
  </div>
  <div id="slideInner">
    <div id="slideCrumb"></div>
    <h2 id="slideTitle"></h2>
    <p id="slideDef"></p>
    <div id="slideWhy"></div>
    <div id="slideSources"></div>
    <div id="slideImpl"></div>
    <div id="slideRecent"></div>
    <div id="slideGrid"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
<script>

          { name: "Statelessness (REST view)", def: "The harness owns state; the model is a stateless server." }
        ]},
        { name: "Reproducibility contract", def: "What it takes to reproduce a run exactly: seed, sampler, core numerics, harness state.", cite: ["batchinvariant","llm42"], children: [
          { name: "Seed & sampler", def: "Fix randomness in token selection." },
          { name: "Core numerics", def: "Batch-invariant kernels for bitwise-identical outputs.", cite: ["batchinvariant"] },
          { name: "Determinism vs speed", def: "Trade a small slowdown for reproducibility.", cite: ["llm42"] }
        ]},
        { name: "Routing & model selection", def: "Choosing which model/size handles each request — part of the interface, not just the harness.", cite: ["routellm","frugalgpt"], impl: ["OpenRouter","LiteLLM"], children: [
          { name: "Router models", def: "Learned routers send queries to the cheapest capable model.", cite: ["routellm"] },
          { name: "Cascades", def: "Try cheap models first, escalate on low confidence.", cite: ["frugalgpt"] },
          { name: "Build-expensive / run-cheap", def: "Compile behavior with a strong model, run with a small one." }
        ]}
      ]},

    /* ===================== IETF ===================== */
    { name: "IETF  (standardization)", def: "Where the Internet community is standardizing the agent stack: agent-to-agent communication, discovery, identity/delegation/audit, AI-usage preferences, and IoT/edge agents. Early I-Ds and BoFs — a rare chance to shape the standards.",
      why: "The same problems this map calls 'glue' and 'harness' (protocols, discovery, identity, audit) are exactly what the IETF has just opened — the venues to influence them exist now.",
      cite: ["catalist","audit","aiprefvocab"],
      recent: [
        ["catalist","CATALIST frames agent-to-agent communication as an Internet-protocol problem and identifies candidate WGs."],
        ["acip","The ACIP framework proposes an Agent Communications Internet Protocol for A2A infrastructure."],
        ["catroute","Treats A2A traffic as a new class with cross-domain routing considerations (the 'agentic network')."],
        ["agentproto","The agentproto BoF proposes protocol building blocks for cross-vendor agent/tool interoperability."],
        ["audit","The AUDIT BoF defines data models to correlate user intent, delegation chains, and authorization for auditing."],
        ["aiprefvocab","The AIPREF WG vocabulary lets content owners declare permissions/restrictions for automated and AI use."],
        ["aiprefattach","AIPREF preferences are signaled during HTTP acquisition, updating robots.txt (RFC 9309)."],
        ["iotagent","LLM agents discover and drive IoT devices over CoAP + hypermedia with no pre-configured device knowledge."],
        ["dawn","The dawn list scopes discovery of agents, tools, and endpoints using IETF technologies."],
        ["aidc","The aidc list covers data-center networking for the AI-cluster serving substrate."]
      ],
      impl: ["IETF datatracker","CATALIST","AIPREF WG","T2TRG"],
      children: [
        { name: "Agent-to-agent communication (CATALIST)", def: "A proposed BoF cluster framing A2A communication as an Internet-protocol problem, with a candidate 'Agent Communications Internet Protocol' (ACIP).", cite: ["catalist","acip","catroute"], children: [
          { name: "Problem-space analysis", def: "Identify the IETF-relevant problem space and candidate WGs.", cite: ["catalist"] },
          { name: "ACIP framework", def: "Use cases, gaps, and a framework for an A2A communications protocol.", cite: ["acip"] },
          { name: "Routing considerations", def: "A2A as a new traffic class; cross-domain routing in the agentic network.", cite: ["catroute"] }
        ]},
        { name: "agentproto (BoF)", def: "Proposed BoF for protocol building blocks enabling cross-vendor agent and agent-tool interoperability over the Internet.", cite: ["agentproto"] },
        { name: "Discovery (dawn / agent2agent)", def: "Discovery of agents, tools, and endpoints using IETF technologies; A2A standardization discussion lists.", cite: ["dawn","agent2agent"] },
        { name: "Identity, delegation & audit (AUDIT)", def: "Data models for auditing distributed agent interactions: correlating user intent, delegation chains, authorization, and propagating audit context. Links to the Harness 'Identity & Permissions' branch.", cite: ["audit"] },
        { name: "AI-usage preferences (AIPREF WG)", def: "Standardizing how content owners signal preferences for AI/automated use of their content — vocabulary + HTTP attachment (updates robots.txt).", cite: ["aiprefvocab","aiprefattach"] },
        { name: "IoT / edge agents (t2trg)", def: "Architecture for LLM agents that discover and interact with IoT devices via CoAP and hypermedia, using in-band CoRE resource discovery.", cite: ["iotagent"] },
        { name: "Data-center substrate (aidc)", def: "Networking for AI clusters — the serving substrate beneath agent workloads.", cite: ["aidc"] }
      ]}
  ]
};

/* ---------- Setup ---------- */
const svg = d3.select("svg");
const gZoom = svg.append("g");
const gLink = gZoom.append("g");
const gNode = gZoom.append("g");

const palette = d3.scaleOrdinal()
  .domain(["Harness  (R&D)","LLM  (R&D)","Glue  (Harness ↔ LLM)","IETF  (standardization)"])
  .range(["#6ea8fe","#c792ea","#80cbc4","#ffab91"]);
const dx = 20, dy = 250;
const tree = d3.tree().nodeSize([dx, dy]);
const diagonal = d3.linkHorizontal().x(d => d.y).y(d => d.x);

const root = d3.hierarchy(DATA);
root.x0 = 0; root.y0 = 0;
let idc = 0;
root.descendants().forEach(d => {
  d.id = ++idc;
  d._children = d.children;
  d.branch = (d.depth >= 1) ? d.ancestors().reverse()[1].data.name : "root";
  if (d.depth >= 1) d.children = null;
});

const zoom = d3.zoom().scaleExtent([0.2, 2.5]).on("zoom", e => gZoom.attr("transform", e.transform));
svg.call(zoom).on("dblclick.zoom", null);

function branchColor(d){ return d.depth === 0 ? "#9ec1ff" : palette(d.branch); }

/* ---------- Info axes: Why · Top papers (cite) · Recent findings (recent) · Landscape (impl) ---------- */
const show = { why:false, refs:false, recent:false, impl:false };
function nodeHasInfo(d){
  return (show.why && d.data.why)
      || (show.refs && d.data.cite && d.data.cite.length)
      || (show.recent && d.data.recent && d.data.recent.length)
      || (show.impl && d.data.impl && d.data.impl.length);
}
const LINKS = {
  "OpenAI":"https://openai.com","OpenAI o-series":"https://openai.com","OpenAI function calling":"https://platform.openai.com/docs/guides/function-calling",
  "Anthropic":"https://www.anthropic.com","Anthropic tool use":"https://docs.claude.com","Claude Code":"https://www.anthropic.com/claude-code","Claude Agent SDK":"https://docs.claude.com","Claude extended thinking":"https://docs.claude.com",
  "Google Gemini":"https://ai.google.dev","Mistral":"https://mistral.ai","Meta Llama":"https://www.llama.com","DeepSeek":"https://www.deepseek.com","DeepSeek-R1":"https://www.deepseek.com","Qwen":"https://github.com/QwenLM",
  "LiteLLM":"https://www.litellm.ai","OpenRouter":"https://openrouter.ai","Ollama":"https://ollama.com","vLLM":"https://github.com/vllm-project/vllm","llama.cpp":"https://github.com/ggml-org/llama.cpp","Unsloth":"https://unsloth.ai",
  "LangChain":"https://www.langchain.com","LangChain / LangGraph":"https://www.langchain.com/langgraph","LangGraph":"https://www.langchain.com/langgraph","LangMem":"https://github.com/langchain-ai/langmem",
  "LlamaIndex":"https://www.llamaindex.ai","AutoGen":"https://microsoft.github.io/autogen/","CrewAI":"https://www.crewai.com","Semantic Kernel":"https://github.com/microsoft/semantic-kernel","OpenAI Agents SDK":"https://openai.github.io/openai-agents-python/",
  "Chroma":"https://www.trychroma.com","Weaviate":"https://weaviate.io","Microsoft GraphRAG":"https://github.com/microsoft/graphrag",
  "Letta (MemGPT)":"https://www.letta.com","Mem0":"https://mem0.ai","Zep":"https://www.getzep.com",
  "Model Context Protocol":"https://modelcontextprotocol.io","Composio":"https://composio.dev","FastMCP":"https://github.com/jlowin/fastmcp","E2B":"https://e2b.dev",
  "Outlines":"https://github.com/dottxt-ai/outlines","XGrammar":"https://github.com/mlc-ai/xgrammar","Guidance":"https://github.com/guidance-ai/guidance","Instructor":"https://python.useinstructor.com",
  "Gorilla":"https://gorilla.cs.berkeley.edu","DSPy":"https://dspy.ai","TextGrad":"https://github.com/zou-group/textgrad",
  "Ragas":"https://docs.ragas.io","DeepEval":"https://github.com/confident-ai/deepeval","Promptfoo":"https://www.promptfoo.dev","Langfuse":"https://langfuse.com","Arize Phoenix":"https://phoenix.arize.com","Braintrust":"https://www.braintrust.dev",
  "NeMo Guardrails":"https://github.com/NVIDIA/NeMo-Guardrails","Guardrails AI":"https://www.guardrailsai.com","Llama Guard":"https://github.com/meta-llama/PurpleLlama","Lakera":"https://www.lakera.ai",
  "Auth0":"https://auth0.com","Keycloak":"https://www.keycloak.org","Open Policy Agent (OPA)":"https://www.openpolicyagent.org","Cedar":"https://www.cedarpolicy.com",
  "IETF datatracker":"https://datatracker.ietf.org","CATALIST":"https://datatracker.ietf.org/doc/draft-yao-catalist-problem-space-analysis/","AIPREF WG":"https://datatracker.ietf.org/wg/aipref/about/","T2TRG":"https://datatracker.ietf.org/rg/t2trg/about/"
};
function chipsHtml(items){
  return items.map(x => { const u = LINKS[x];
    return u ? `<a class="chip" href="${u}" target="_blank" rel="noopener">${escapeHtml(x)}</a>` : `<span class="chip">${escapeHtml(x)}</span>`;
  }).join("");
}
function refLinkHtml(id){
  const r = REFS[id]; if (!r) return "";
  return `<div class="ref"><a href="${r.url}" target="_blank" rel="noopener">${escapeHtml(r.authors)} (${r.year}) — ${escapeHtml(r.title)}</a><span class="venue">${escapeHtml(r.venue)}</span></div>`;
}
function recentHtml(list){
  return list.map(([id,find]) => { const r = REFS[id]; if (!r) return "";
    return `<div class="ref"><a href="${r.url}" target="_blank" rel="noopener">${escapeHtml(r.authors)} (${r.year}) — ${escapeHtml(r.title)}</a><span class="find">${escapeHtml(find)}</span></div>`;
  }).join("");
}
function sourcesHtml(cite){
  return "Top papers: " + cite.map(id => REFS[id]
    ? `<a href="${REFS[id].url}" target="_blank" rel="noopener">${escapeHtml(REFS[id].short)}</a>` : "")
    .filter(Boolean).join(" · ");
}

/* ---------- Tree render ---------- */
function update(source){
  const nodes = root.descendants();
  const links = root.links();
  tree(root);
  const t = svg.transition().duration(250);

  const node = gNode.selectAll("g.node").data(nodes, d => d.id);
  const nodeEnter = node.enter().append("g").attr("class","node")
    .attr("transform", d => `translate(${source.y0},${source.x0})`)
    .on("click", (e,d) => { const willExpand = !d.children && d._children; toggle(d); select(d); update(d); if (willExpand) focusNode(d); })
    .on("dblclick", (e,d) => { e.stopPropagation(); if (d._children || d.children) present(d); })
    .on("mouseover", (e,d) => { if(!pinned) render(d); });
  nodeEnter.append("circle").attr("r", 5).attr("fill", d => d._children ? branchColor(d) : "#11141a").attr("stroke", d => branchColor(d));
  nodeEnter.append("text").attr("dy","0.32em").attr("x", d => d._children ? -10 : 10)
    .attr("text-anchor", d => d._children ? "end" : "start").text(d => d.data.name);

  const nodeMerge = nodeEnter.merge(node);
  nodeMerge.transition(t).attr("transform", d => `translate(${d.y},${d.x})`);
  nodeMerge.select("circle").attr("fill", d => (d._children && !d.children) ? branchColor(d) : "#11141a");
  nodeMerge.select("text").attr("x", d => d.children || d._children ? -10 : 10).attr("text-anchor", d => d.children || d._children ? "end" : "start");
  node.exit().transition(t).remove().attr("transform", d => `translate(${source.y},${source.x})`);

  const link = gLink.selectAll("path.link").data(links, d => d.target.id);
  const linkEnter = link.enter().append("path").attr("class","link").attr("d", () => { const o = {x: source.x0, y: source.y0}; return diagonal({source:o,target:o}); });
  link.merge(linkEnter).transition(t).attr("d", diagonal);
  link.exit().transition(t).remove().attr("d", () => { const o = {x: source.x, y: source.y}; return diagonal({source:o,target:o}); });

  root.eachBefore(d => { d.x0 = d.x; d.y0 = d.y; });
  applySearch(); refreshHighlight(); refreshInfo();
}
function focusNode(d){
  const nodes = d.descendants();
  const xs = nodes.map(n => n.x), ys = nodes.map(n => n.y);
  const minX = Math.min(...xs), maxX = Math.max(...xs), minY = Math.min(...ys), maxY = Math.max(...ys);
  const sw = svg.node().clientWidth, sh = svg.node().clientHeight, pad = 80;
  const needW = (maxY - minY) + dy * 1.3 + pad, needH = (maxX - minX) + pad * 2;
  const k0 = d3.zoomTransform(svg.node()).k;
  let scale = Math.min(k0, sw / needW, sh / needH); scale = Math.max(0.25, Math.min(scale, 2.0));
  const cy = (minY + maxY) / 2, cx = (minX + maxX) / 2;
  const tx = sw / 2 - scale * cy, ty = sh / 2 - scale * cx;
  svg.transition().duration(450).call(zoom.transform, d3.zoomIdentity.translate(tx, ty).scale(scale));
}
function toggle(d){ if (d.children) { d.children = null; } else { d.children = d._children; } }

/* ---------- Side panel ---------- */
let pinned = false, selectedId = null;
const elTerm=document.getElementById("term"), elDef=document.getElementById("def"), elCrumb=document.getElementById("crumb"),
      elKids=document.getElementById("kids"), elWhy=document.getElementById("why"), elRefs=document.getElementById("refs"),
      elRecent=document.getElementById("recent"), elImpl=document.getElementById("impl");

function render(d){
  const color = branchColor(d);
  elTerm.innerHTML = `<span class="swatch" style="background:${color}"></span>${escapeHtml(d.data.name)}`;
  elDef.textContent = d.data.def || "—"; elDef.classList.toggle("empty", !d.data.def);
  elCrumb.textContent = d.ancestors().reverse().slice(0,-1).map(a => a.data.name).join("  ›  ");
  renderAxes(d);
  const kids = d._children || d.children;
  elKids.innerHTML = "";
  if (kids && kids.length){
    const pb = document.createElement("button"); pb.className="present-btn"; pb.textContent="▶ Present this page"; pb.onclick=()=>present(d); elKids.appendChild(pb);
    const h = document.createElement("h2"); h.textContent="Explore"; elKids.appendChild(h);
    kids.forEach(k => { const b=document.createElement("button"); b.textContent=k.data.name;
      b.onclick=()=>{ if(!d.children){ d.children=d._children; update(d); focusNode(d);} setSelected(k); }; elKids.appendChild(b); });
  }
}
function renderAxes(d){
  if (show.why && d.data.why){ elWhy.hidden=false; elWhy.innerHTML=`<h2>Why it matters</h2><p>${escapeHtml(d.data.why)}</p>`; } else { elWhy.hidden=true; elWhy.innerHTML=""; }
  if (show.refs && d.data.cite && d.data.cite.length){ elRefs.hidden=false; elRefs.innerHTML=`<h2>Top papers</h2>`+d.data.cite.map(refLinkHtml).join(""); } else { elRefs.hidden=true; elRefs.innerHTML=""; }
  if (show.recent && d.data.recent && d.data.recent.length){ elRecent.hidden=false; elRecent.innerHTML=`<h2>Recent findings (2024–26)</h2>`+recentHtml(d.data.recent); } else { elRecent.hidden=true; elRecent.innerHTML=""; }
  if (show.impl && d.data.impl && d.data.impl.length){ elImpl.hidden=false; elImpl.innerHTML=`<h2>Tools &amp; frameworks</h2><div class="chips">`+chipsHtml(d.data.impl)+`</div>`; } else { elImpl.hidden=true; elImpl.innerHTML=""; }
}
function refreshHighlight(){ gNode.selectAll("g.node").classed("selected", n => n.id === selectedId).select("circle").attr("r", n => n.id === selectedId ? 7.5 : 5); }
function refreshInfo(){ gNode.selectAll("g.node").classed("hasinfo", d => nodeHasInfo(d)); }
function select(d){ pinned = true; selectedId = d.id; render(d); refreshHighlight(); }
function panTo(d){ const sw=svg.node().clientWidth, sh=svg.node().clientHeight, k=d3.zoomTransform(svg.node()).k;
  const tx=sw*0.32-k*d.y, ty=sh/2-k*d.x; svg.transition().duration(300).call(zoom.transform, d3.zoomIdentity.translate(tx,ty).scale(k)); }
function setSelected(d){ select(d); panTo(d); }
function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

/* ---------- Toggles ---------- */
const togWhy=document.getElementById("togWhy"), togRefs=document.getElementById("togRefs"),
      togRecent=document.getElementById("togRecent"), togImpl=document.getElementById("togImpl");
function onToggle(){
  show.why=togWhy.checked; show.refs=togRefs.checked; show.recent=togRecent.checked; show.impl=togImpl.checked;
  const cur = root.descendants().find(n => n.id === selectedId); if (cur) renderAxes(cur);
  refreshInfo(); if (!slide.hidden) renderSlide();
}
[togWhy,togRefs,togRecent,togImpl].forEach(t => t.addEventListener("change", onToggle));

/* ---------- Search ---------- */
const search=document.getElementById("search"); let query="";
search.addEventListener("input", () => { query=search.value.trim().toLowerCase();
  if (query){ root.descendants().forEach(d => { if (d.data.name.toLowerCase().includes(query)) d.ancestors().forEach(a => { if (a._children && !a.children) a.children=a._children; }); }); update(root); }
  else { applySearch(); } });
function applySearch(){ gNode.selectAll("g.node").classed("match", d => query && d.data.name.toLowerCase().includes(query)).classed("dim", d => query && !d.data.name.toLowerCase().includes(query)); }

/* ---------- Controls ---------- */
document.getElementById("expand").onclick = () => { root.each(d => { if (d._children) d.children=d._children; }); update(root); fit(); };
document.getElementById("collapse").onclick = () => { root.descendants().forEach(d => { if (d.depth>=1){ d._children=d._children||d.children; d.children=null; } }); update(root); fit(); };
document.getElementById("reset").onclick = () => { search.value=""; query=""; pinned=false; applySearch(); fit(); };

/* ---------- Fit ---------- */
function fit(){ setTimeout(() => { const b=gZoom.node().getBBox(); const sw=svg.node().clientWidth, sh=svg.node().clientHeight;
  if (!b.width || !b.height) return; const scale=Math.min(2.2, 0.9/Math.max(b.width/sw, b.height/sh));
  const tx=sw/2-scale*(b.x+b.width/2), ty=sh/2-scale*(b.y+b.height/2);
  svg.transition().duration(400).call(zoom.transform, d3.zoomIdentity.translate(tx,ty).scale(scale)); }, 300); }

/* ---------- Present mode ---------- */
const slide=document.getElementById("slide"), slideTitle=document.getElementById("slideTitle"), slideDef=document.getElementById("slideDef"),
      slideCrumb=document.getElementById("slideCrumb"), slideGrid=document.getElementById("slideGrid"), slidePos=document.getElementById("slidePos"),
      slideWhy=document.getElementById("slideWhy"), slideSources=document.getElementById("slideSources"), slideImpl=document.getElementById("slideImpl"),
      slideRecent=document.getElementById("slideRecent");
let slideNode=null;
function present(d){ if (!(d._children || d.children)) return; slideNode=d; renderSlide(); slide.hidden=false; }
function renderSlide(){
  const d=slideNode;
  slideCrumb.textContent = d.ancestors().reverse().map(a => a.data.name).join("  ›  ");
  slideTitle.innerHTML = `<span class="swatch" style="background:${branchColor(d)}"></span>${escapeHtml(d.data.name)}`;
  slideDef.textContent = d.data.def || "";
  slideWhy.textContent = (show.why && d.data.why) ? d.data.why : "";
  slideSources.innerHTML = (show.refs && d.data.cite && d.data.cite.length) ? sourcesHtml(d.data.cite) : "";
  slideImpl.innerHTML = (show.impl && d.data.impl && d.data.impl.length) ? chipsHtml(d.data.impl) : "";
  slideRecent.innerHTML = (show.recent && d.data.recent && d.data.recent.length) ? `<h4>Recent findings (2024–26)</h4>`+recentHtml(d.data.recent) : "";
  const kids = d._children || d.children || [];
  slideGrid.innerHTML = "";
  kids.forEach(k => {
    const card=document.createElement("div"); card.className="card"; card.style.borderTopColor=branchColor(k);
    const h=document.createElement("h3"); h.textContent=k.data.name; card.appendChild(h);
    const p=document.createElement("p"); p.textContent=k.data.def || ""; card.appendChild(p);
    if (show.why && k.data.why){ const w=document.createElement("p"); w.className="why"; w.textContent=k.data.why; card.appendChild(w); }
    if (show.refs && k.data.cite && k.data.cite.length){ const s=document.createElement("div"); s.className="sources"; s.innerHTML=sourcesHtml(k.data.cite); card.appendChild(s); }
    if (show.impl && k.data.impl && k.data.impl.length){ const m=document.createElement("div"); m.className="impl"; m.innerHTML=chipsHtml(k.data.impl); card.appendChild(m); }
    const gk=k._children || k.children;
    if (gk && gk.length){ const ul=document.createElement("ul"); ul.className="sub";
      gk.forEach(g => { const li=document.createElement("li"); li.innerHTML=`<b>${escapeHtml(g.data.name)}</b> — ${escapeHtml(g.data.def || "")}`; ul.appendChild(li); });
      card.appendChild(ul); card.classList.add("hasKids"); card.title="Open this sub-page"; card.onclick=()=>{ slideNode=k; renderSlide(); }; }
    slideGrid.appendChild(card);
  });
  const parent=d.parent, sibs=parent ? (parent.children || parent._children) : null;
  slidePos.textContent = (sibs && sibs.length>1) ? `${sibs.indexOf(d)+1} / ${sibs.length}` : "";
  slide.scrollTop = 0;
}
function sib(step){ const d=slideNode, parent=d.parent, sibs=parent ? (parent.children || parent._children) : null;
  if (!sibs || sibs.length<2) return; const idx=(sibs.indexOf(d)+step+sibs.length)%sibs.length; slideNode=sibs[idx]; renderSlide(); }
function goUp(){ if (slideNode.parent){ slideNode=slideNode.parent; renderSlide(); } }
function goInto(){ const kids=(slideNode._children || slideNode.children || []).filter(k => k._children || k.children); if (kids.length){ slideNode=kids[0]; renderSlide(); } }
function closeSlide(){ slide.hidden=true; }
document.getElementById("prevSib").onclick=()=>sib(-1);
document.getElementById("nextSib").onclick=()=>sib(1);
document.getElementById("upSlide").onclick=goUp;
document.getElementById("closeSlide").onclick=closeSlide;

/* ---------- Keyboard ---------- */
function visibleList(){ return root.descendants().slice().sort((a,b) => a.x - b.x); }
document.addEventListener("keydown", e => {
  if (!slide.hidden){ if (e.key==="Escape") closeSlide(); else if (e.key==="ArrowLeft") sib(-1); else if (e.key==="ArrowRight") sib(1); else if (e.key==="ArrowUp") goUp(); else if (e.key==="ArrowDown") goInto(); return; }
  if (document.activeElement === search) return;
  let cur = root.descendants().find(n => n.id === selectedId) || root;
  switch (e.key){
    case "ArrowDown": { e.preventDefault(); const L=visibleList(); const i=L.indexOf(cur); if (i>-1 && i<L.length-1) setSelected(L[i+1]); break; }
    case "ArrowUp":   { e.preventDefault(); const L=visibleList(); const i=L.indexOf(cur); if (i>0) setSelected(L[i-1]); break; }
    case "ArrowRight":{ e.preventDefault(); if (cur._children && !cur.children){ cur.children=cur._children; update(cur); setSelected(cur); } else if (cur.children && cur.children.length){ setSelected(cur.children[0]); } break; }
    case "ArrowLeft": { e.preventDefault(); if (cur.children){ cur.children=null; update(cur); setSelected(cur); } else if (cur.parent){ setSelected(cur.parent); } break; }
    case "Enter": { e.preventDefault(); if (cur._children || cur.children) present(cur); break; }
    case "p": { if (cur && (cur._children || cur.children)) present(cur); break; }
  }
});

/* ---------- Init ---------- */
update(root); render(root); selectedId = root.id; refreshHighlight(); pinned = false; fit();
window.addEventListener("resize", fit);
</script>
</body>
