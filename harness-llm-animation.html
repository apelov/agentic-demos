<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>Agent = LLM + Harness — token flow animation</title>
<style>
  :root{ --ink:#1e1b2e; --harness:#1d4ed8; --llm:#6d28d9; --tool:#0f766e;
         --in:#1d4ed8; --out:#7c3aed; --good:#047857; --bad:#b91c1c; --line:#c7c9d6; }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;background:#f6f5fb;color:var(--ink);
    font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-text-size-adjust:100%;}
  #wrap{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:10px;padding:8px;padding:max(8px,env(safe-area-inset-top)) 8px max(8px,env(safe-area-inset-bottom));}
  #bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center;}
  button{font:inherit;font-weight:700;border:1px solid var(--line);background:#fff;color:var(--ink);
    border-radius:10px;padding:8px 14px;cursor:pointer;min-height:40px;}
  button.primary{background:linear-gradient(135deg,#7c3aed,#5b21b6);color:#fff;border-color:transparent;}
  button:disabled{opacity:.4;cursor:default;}
  button:not(:disabled):hover{filter:brightness(1.04);}
  #speed{display:flex;gap:6px;align-items:center;color:#6b6880;font-size:14px;}
  #ind{font-weight:700;color:#6b6880;font-size:14px;min-width:84px;text-align:center;}
  #cap{font-size:19px;font-weight:600;min-height:2.4em;color:#3b3552;text-align:center;
    display:flex;align-items:center;justify-content:center;line-height:1.25;max-width:1040px;}
  #cap b{color:var(--llm);} #cap code{font-family:ui-monospace,Menlo,Consolas,monospace;color:var(--out);}

  /* the stage is sized in JS to fit the viewport at the active layout's aspect ratio */
  #stage{position:relative;background:#fff;border:1px solid #e7e1f6;border-radius:16px;
    box-shadow:0 10px 40px rgba(76,29,149,.10);overflow:hidden;touch-action:manipulation;}
  .box{position:absolute;border-radius:14px;border:2px solid;display:flex;flex-direction:column;
    transition:left .35s,top .35s,width .35s,height .35s;}
  .box .hd{font-weight:800;letter-spacing:.04em;padding:7px 11px;font-size:17px;}
  #harness{border-color:var(--harness);background:#eef3ff;} #harness .hd{color:var(--harness);}
  #llm{border-color:var(--llm);background:#f3eafe;} #llm .hd{color:var(--llm);}
  #tool{border-color:var(--tool);background:#e9f6f3;} #tool .hd{color:var(--tool);font-size:14px;}
  #llm.pulse,#tool.flash{animation:flash .5s ease;}
  @keyframes flash{0%{filter:none}40%{filter:brightness(1.12) drop-shadow(0 0 10px rgba(124,58,237,.5))}100%{filter:none}}
  .sub{color:#7a708f;font-size:12.5px;line-height:1.35;padding:0 11px;}
  .sub small{color:#a99fc0;font-size:11.5px;}
  #toolsub{color:#5a8f86;font-size:12px;padding:0 11px;}
  #ctx{margin:2px 9px 9px;flex:1;overflow:hidden;display:flex;flex-direction:column;}
  #ctx .lbl{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:#8a82a0;margin-bottom:3px;}
  #ctxlist{flex:1;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;}
  .ctxline{font:12.5px/1.45 ui-monospace,Menlo,Consolas,monospace;background:#fff;border:1px solid #dfe3f3;
    border-radius:6px;padding:2px 7px;margin:2.5px 0;color:#2a2f55;opacity:0;transform:translateY(4px);
    transition:opacity .25s,transform .25s;}
  .ctxline.show{opacity:1;transform:none;}
  .ctxline.gen{color:var(--out);border-color:#e3d7fb;background:#faf7ff;}
  .ctxline.res{color:var(--tool);border-color:#cdeae3;background:#f0fbf8;}

  /* layout-specific box geometry (percentages of the stage) */
  #stage.landscape #harness{left:5.5%;top:20%;width:24%;height:60%;}
  #stage.landscape #llm    {left:73%;top:20%;width:21.5%;height:35%;}
  #stage.landscape #tool   {left:41%;top:81%;width:19.5%;height:13.5%;}
  #stage.portrait  #harness{left:5%;top:3.5%;width:90%;height:43%;}
  #stage.portrait  #llm    {left:6%;top:53%;width:44%;height:27%;}
  #stage.portrait  #tool   {left:55%;top:55%;width:39%;height:21%;}

  svg.lanes{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;}
  .lane{stroke:var(--line);stroke-width:2;fill:none;}
  .lanelbl{fill:#9a93ac;}
  #stage.landscape .lanes.port{display:none;}
  #stage.portrait  .lanes.land{display:none;}

  .tok{position:absolute;font:14px/1 ui-monospace,Menlo,Consolas,monospace;font-weight:700;
    padding:5px 9px;border-radius:8px;color:#fff;white-space:nowrap;transform:translate(-50%,-50%);
    box-shadow:0 3px 10px rgba(0,0,0,.12);opacity:1;}
  .tok.in{background:var(--in);} .tok.out{background:var(--out);}
  .tok.tool{background:var(--tool);} .tok.good{background:var(--good);}
  .tok.ghost{background:#aeb4c6;font-style:italic;box-shadow:none;opacity:.85;}
  .tok.fb{background:#8b93b3;font-size:12px;padding:4px 8px;}
  .phase{position:absolute;left:50%;top:10px;transform:translateX(-50%);font-weight:800;
    font-size:13px;letter-spacing:.03em;color:#8a82a0;text-align:center;width:90%;}
  .hint{position:absolute;right:12px;bottom:10px;font-size:11.5px;color:#b4adc6;}

  @media (max-width:760px){
    #cap{font-size:15px;min-height:3em;}
    #speed{display:none;}
    button{padding:9px 13px;}
    .box .hd{font-size:15px;}
  }
</style>
</head>
<body>
<div id="wrap">
  <div id="cap"></div>
  <div id="stage" class="landscape">
    <svg class="lanes land" viewBox="0 0 1040 600" preserveAspectRatio="none">
      <defs><marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
        <path d="M0,0 L7,3 L0,6 Z" fill="#c7c9d6"/></marker></defs>
      <path class="lane" marker-end="url(#ah)" d="M310,200 L756,200"/>
      <text class="lanelbl" x="455" y="190" font-size="12">prompt / context  →</text>
      <path class="lane" marker-end="url(#ah)" d="M760,300 L314,300"/>
      <text class="lanelbl" x="455" y="322" font-size="12">←  generated tokens (one at a time)</text>
      <path class="lane" marker-end="url(#ah)" d="M250,470 L470,496"/>
      <path class="lane" marker-end="url(#ah)" d="M470,548 L250,480"/>
    </svg>
    <svg class="lanes port" viewBox="0 0 620 1000" preserveAspectRatio="none">
      <path class="lane" marker-end="url(#ah)" d="M124,470 L124,524"/>
      <text class="lanelbl" x="40" y="505" font-size="20">prompt ↓</text>
      <path class="lane" marker-end="url(#ah)" d="M211,524 L211,470"/>
      <text class="lanelbl" x="222" y="505" font-size="20">↑ tokens</text>
      <path class="lane" marker-end="url(#ah)" d="M462,470 L462,534"/>
      <path class="lane" marker-end="url(#ah)" d="M438,534 L438,474"/>
      <text class="lanelbl" x="332" y="505" font-size="20">tool ↕</text>
    </svg>
    <div class="phase" id="phase"></div>
    <div class="box" id="harness"><div class="hd">HARNESS</div>
      <div id="ctx"><div class="lbl">context (the running transcript)</div>
        <div id="ctxlist"></div></div></div>
    <div class="box" id="llm"><div class="hd">LLM</div>
      <div class="sub">text in → next token out<br><small>stateless · probabilistic</small></div></div>
    <div class="box" id="tool"><div class="hd">Tool: get_logs()</div>
      <div id="toolsub">deterministic</div></div>
    <div class="hint" id="hint">← / → to step</div>
  </div>
  <div id="bar">
    <button id="prev">◂ Prev</button>
    <button class="primary" id="next">Next ▸</button>
    <button id="play">▶ Play</button>
    <button id="restart">↻ Restart</button>
    <span id="ind">start</span>
    <span id="speed">speed
      <input type="range" id="spd" min="0.5" max="2" step="0.25" value="1"><span id="spdv">1.0×</span></span>
  </div>
</div>

<script>
const stage=document.getElementById('stage'), ctxlist=document.getElementById('ctxlist'),
      cap=document.getElementById('cap'), phaseEl=document.getElementById('phase'),
      llm=document.getElementById('llm'), tool=document.getElementById('tool'),
      ind=document.getElementById('ind');

let SPEED=1, INSTANT=false, busy=false, cur=-1;
const dur = ms => INSTANT?0:ms/SPEED;
const sleep = ms => new Promise(r=>setTimeout(r, dur(ms)));

// --- layout: fractional anchor points, swapped per orientation -------------
// each anchor is {x,y} as a fraction of the stage's width/height.
const A_LAND={
  hOut:{x:.298,y:.333}, lIn:{x:.727,y:.333},        // prompt lane (harness → LLM)
  lOut:{x:.727,y:.500}, hIn:{x:.356,y:.500},        // generated lane (LLM → harness)
  ghost:{x:.563,y:.500},                            // discarded mid-prompt prediction
  toolFrom:{x:.356,y:.783}, tool:{x:.519,y:.850},   // harness ↔ tool
  done:{x:.192,y:.500}
};
const A_PORT={
  hOut:{x:.200,y:.470}, lIn:{x:.200,y:.530},
  lOut:{x:.340,y:.530}, hIn:{x:.340,y:.470},
  ghost:{x:.340,y:.700},
  toolFrom:{x:.745,y:.470}, tool:{x:.710,y:.610},
  done:{x:.270,y:.460}
};
let A=A_LAND, MODE='land', SW=1040, SH=600;
const px = a => ({x:a.x*SW, y:a.y*SH});

function pickMode(){ return window.innerHeight > window.innerWidth ? 'port' : 'land'; }
function setMode(m){ if(m===MODE) return; MODE=m; A = m==='port'?A_PORT:A_LAND;
  stage.classList.toggle('portrait', m==='port'); stage.classList.toggle('landscape', m==='land'); }

function fit(){
  setMode(pickMode());
  const AR = MODE==='port' ? 620/1000 : 1040/600;
  const barH = document.getElementById('bar').offsetHeight || 56;
  const capH = cap.offsetHeight || 30;
  const availW = window.innerWidth  - (MODE==='port'?14:40);
  const availH = window.innerHeight - barH - capH - 30;
  let w = Math.min(availW, availH*AR, 1040);
  let h = w/AR;
  if(h>availH){ h=availH; w=h*AR; }
  SW=w; SH=h;
  stage.style.width = w+'px'; stage.style.height = h+'px';
}
window.addEventListener('resize', fit);
window.addEventListener('orientationchange', ()=>setTimeout(fit,200));

const setCap=h=>cap.innerHTML=h, setPhase=t=>phaseEl.textContent=t;
function clearTokens(){ stage.querySelectorAll('.tok').forEach(e=>e.remove()); }
function resetCtx(){ ctxlist.innerHTML=''; }
function tok(text,p,kind){ const t=document.createElement('div'); t.className='tok '+kind;
  t.textContent=text; t.style.left=p.x+'px'; t.style.top=p.y+'px'; stage.appendChild(t); return t; }
function moveTo(el,p,ms){ el.style.transition=`left ${dur(ms)}ms cubic-bezier(.4,0,.2,1), top ${dur(ms)}ms cubic-bezier(.4,0,.2,1)`;
  void el.offsetWidth; el.style.left=p.x+'px'; el.style.top=p.y+'px'; return sleep(ms); }
async function fadeRemove(el,ms=250){ if(!el)return; el.style.transition=`opacity ${dur(ms)}ms`;
  void el.offsetWidth; el.style.opacity=0; await sleep(ms); el.remove(); }
function pulse(el,cls){ el.classList.add(cls); setTimeout(()=>el.classList.remove(cls), dur(500)); }
function ctxAdd(text,kind=''){ const d=document.createElement('div'); d.className='ctxline '+kind; d.textContent=text;
  ctxlist.appendChild(d); void d.offsetWidth; d.classList.add('show'); }

// --- mechanics -------------------------------------------------------------
async function sendIn(text){                          // one prompt token harness -> LLM
  const t=tok(text,px(A.hOut),'in'); await moveTo(t,px(A.lIn),750); await fadeRemove(t,160);
  ctxAdd(text); pulse(llm,'pulse'); }
async function ghost(text){                            // a discarded mid-prompt next-token prediction
  const g=tok(text,px(A.lOut),'ghost'); await moveTo(g,px(A.ghost),600); await fadeRemove(g,350); }
async function emit(text,kind='gen'){                  // LLM generates a token -> harness, appended
  const t=tok(text,px(A.lOut),kind==='gen'?'out':kind); await moveTo(t,px(A.hIn),750); await fadeRemove(t,160);
  ctxAdd(text, kind); }
async function feedback(){                             // append + re-send whole context to the LLM
  const d=tok('↺ context',px(A.hOut),'fb'); await moveTo(d,px(A.lIn),500); await fadeRemove(d,140); pulse(llm,'pulse'); }
async function invokeTool(){                           // harness runs the tool, result -> context
  const a=tok('get_logs()',px(A.toolFrom),'out'); await moveTo(a,px(A.tool),650); pulse(tool,'flash'); await fadeRemove(a,140);
  const r=tok('logs: timeout',px(A.tool),'tool'); await moveTo(r,px(A.toolFrom),650); await fadeRemove(r,140);
  ctxAdd('→ logs: timeout','res'); }

const STEPS=[
 {run:async()=>{ resetCtx(); setPhase('prompt ingestion — token by token');
   setCap('Feed the prompt <b>one token at a time</b>.');
   await sendIn('Diagnose');
   setCap('After each token the model predicts a next one — here a <b>guess we discard</b>.');
   await ghost('the'); }},
 {run:async()=>{ await sendIn('ticket');
   setCap('Mid-prompt predictions are <b>discarded</b> — only the prediction after the <b>last</b> token is used.');
   await ghost('error'); }},
 {run:async()=>{ await sendIn('#4521');
   setCap('Now the next prediction is the <b>real start of the answer</b>.'); }},
 {run:async()=>{ setPhase('generation — autoregressive');
   setCap('It generates <code>&lt;tool&gt;</code> — the model is asking to call a tool.');
   await emit('<tool>'); await feedback(); }},
 {run:async()=>{ setCap('Every generated token is <b>fed back</b> to produce the next (autoregression).');
   await emit('call_get_logs()'); await feedback(); }},
 {run:async()=>{ setCap('It closes the tag: <code>&lt;/tool&gt;</code> — the tool call is now <b>complete</b>.');
   await emit('</tool>'); }},
 {run:async()=>{ setCap('The <b>harness</b> sees the closed tag and <b>invokes the tool</b>.');
   await invokeTool(); }},
 {run:async()=>{ setCap('The result is appended and <b>fed back</b> — generation continues.');
   await feedback(); await emit('restart(svc)'); await feedback(); }},
 {run:async()=>{ setCap('…until the task is <b>done</b>. ✓');
   const d=tok('Fixed ✓',px(A.lOut),'good'); await moveTo(d,px(A.done),800); await fadeRemove(d,200); ctxAdd('Fixed ✓','res'); }},
];
const N=STEPS.length;

function updateUI(){ ind.textContent = cur<0?'start':('step '+(cur+1)+' / '+N);
  document.getElementById('prev').disabled=busy||cur<0;
  document.getElementById('next').disabled=busy||cur>=N-1; }
function resetScene(){ clearTokens(); resetCtx(); setPhase(''); cur=-1;
  setCap('Agent&nbsp;=&nbsp;LLM&nbsp;+&nbsp;Harness — <b>tap</b> or use the buttons to step.'); }

async function goto(t){ t=Math.max(-1,Math.min(N-1,t));
  if(busy||t===cur) return; busy=true; updateUI();
  try{ if(t<cur){ resetScene(); INSTANT=true; for(let k=0;k<=t;k++){ await STEPS[k].run(); cur=k; } INSTANT=false; }
       else { for(let k=cur+1;k<=t;k++){ await STEPS[k].run(); cur=k; } } }
  finally{ busy=false; updateUI(); } }
async function playAll(){ if(busy)return; if(cur>=N-1) await goto(-1);
  while(cur<N-1){ await goto(cur+1); if(cur<N-1) await sleep(450); } }

document.getElementById('next').onclick   =()=>goto(cur+1);
document.getElementById('prev').onclick   =()=>goto(cur-1);
document.getElementById('play').onclick   =()=>playAll();
document.getElementById('restart').onclick=()=>{ resetScene(); updateUI(); };
document.getElementById('spd').oninput =e=>{ SPEED=+e.target.value; document.getElementById('spdv').textContent=SPEED.toFixed(1)+'×'; };
document.addEventListener('keydown',e=>{
  if(['ArrowRight','ArrowDown','PageDown',' '].includes(e.key)){ e.preventDefault(); goto(cur+1); }
  else if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){ e.preventDefault(); goto(cur-1); }
  else if(e.key==='Home'){ e.preventDefault(); resetScene(); updateUI(); }
  else if(e.key==='End'){ e.preventDefault(); goto(N-1); }
});

// --- touch: tap to advance, horizontal swipe to step ----------------------
const isTouch = window.matchMedia('(hover:none)').matches || 'ontouchstart' in window;
if(isTouch){
  document.getElementById('hint').textContent='tap / swipe to step';
  let sx=0, sy=0;
  stage.addEventListener('touchstart',e=>{ const t=e.changedTouches[0]; sx=t.clientX; sy=t.clientY; },{passive:true});
  stage.addEventListener('touchend',e=>{ const t=e.changedTouches[0];
    const dx=t.clientX-sx, dy=t.clientY-sy;
    if(Math.abs(dx)>40 && Math.abs(dx)>Math.abs(dy)) goto(dx>0?cur-1:cur+1);   // swipe
    else goto(cur+1);                                                          // tap
  },{passive:true});
}

resetScene(); updateUI(); fit();
</script>
</body>
</html>
